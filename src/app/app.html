<main>
  <div class="header">
    <h1 class="text-center text-3xl">Notes app</h1>
  </div>
  <div class="max-w-4xl mx-auto p-6 space-y-8">
  <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-md mx-auto">
    <h2 class="text-xl font-semibold mb-4 text-slate-800">New Note</h2>
    
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="title" class="text-sm font-medium text-slate-600">Title</label>
        <input 
          id="title"
          formControlName="title" 
          type="text" 
          placeholder="Title..." 
          class="px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition"
        >
      </div>

      <div class="flex flex-col gap-1">
        <label for="text" class="text-sm font-medium text-slate-600">Text</label>
        <textarea 
          id="text"
          formControlName="text" 
          rows="3"
          placeholder="Write a note..." 
          class="px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition resize-none"
        ></textarea>
      </div>

      <button 
        type="submit" 
        class="mt-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-medium py-2 px-4 rounded-xl shadow-sm transition-all cursor-pointer"
      >
        Save Note
      </button>
    </form>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    @for (item of notes_list; track item.title) {
      <div class="bg-emerald-50/60 border border-emerald-200 rounded-2xl p-4 flex flex-col justify-between hover:shadow-md transition">
        <div class="space-y-2">
          <h3 class="font-bold text-slate-800 text-lg break-words">{{ item.title }}</h3>
          <p class="text-slate-600 text-sm whitespace-pre-line break-words">{{ item.text }}</p>
        </div>
        
        <div class="mt-4 pt-2 flex justify-end border-t border-emerald-200/60">
          <button 
            type="button"
            (click)="toggleDelete(item.title)" 
            class="text-xs font-medium text-rose-600 hover:text-rose-700 hover:bg-rose-100/50 px-2 py-1 rounded-lg transition cursor-pointer"
          >
            Delete
          </button>
        </div>
      </div>
    } @empty {
      <div class="col-span-full text-center py-12 text-slate-400">
        No notes yet. Create your first note above!
      </div>
    }
  </div>
</div>
</main>
